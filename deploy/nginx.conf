# Proxy HTTPS (cert self-signed) na frente do inference-service.
# Só /api/* é roteado; o serviço nunca é exposto diretamente (expose, sem ports).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Decisão do time (11/06/2026): endpoints SEM autenticação por enquanto.
    # Risco aceito: /api/metrics dispara avaliação cara (~200 usuários x 446
    # itens; variar params força recomputo) — se virar problema, reintroduzir
    # allowlist de IP ou auth_basic aqui (ver runbook docs/Deploy_Recomendacao.md).
    location /api/ {
        proxy_pass http://inference:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/metrics sem cache pode demorar; margem acima do default de 60s
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
