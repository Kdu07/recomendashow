services:
  db:
    build: ./src/database

    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  mongodb:
    build: ./src/mongodb
 
    container_name: aventura_mongodb
 
    restart: always
 
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: aventura_ml
 
    ports:
      - "${MONGO_PORT}:27017"
 
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data: