# Deploy do sistema de recomendação (inference-service + nginx).
# Local (verificação): docker compose -f docker-compose.deploy.yml up --build
# Na VM: a imagem chega via docker load; up -d SEM --build usa a tag carregada.
services:
  inference:
    image: aventura-recsys-inference:latest
    build:
      context: .
      dockerfile: src/inference-service/Dockerfile
    env_file: .env.deploy
    volumes:
      - ./data:/app/data:ro
    expose:
      - "8080"
    # VM de 1 GB: o primeiro batch roda logo no startup e é o pico de memória.
    # Se der OOM (crash loop), ver runbook docs/Deploy_Recomendacao.md.
    mem_limit: 600m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped
